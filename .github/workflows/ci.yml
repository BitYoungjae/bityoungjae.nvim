name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  contrast:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        neovim: [v0.10.4, stable]
    steps:
      - uses: actions/checkout@v4

      - uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: ${{ matrix.neovim }}

      - name: 대비·ΔE·앵커 회귀 테스트
        run: nvim --headless -u tests/minimal_init.lua -c "luafile tests/contrast.lua" -c "qa!"
